# Vendor template from https://starsling.dev/automated-code-review (verbatim job body).
# ASSUMPTION: the vendor publishes no `on:` block; `on: pull_request` below is added by the preparer.
name: review
on: pull_request
jobs:
  review:
    runs-on: starsling-review
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
